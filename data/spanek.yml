id: "spanek"
title : "Kde budu spát?"
content: |
  Jste-li z okolí, doufáme že doma.
  V areálu je možnost přespání v 6 dvoulůžkových luxusních podsádkových stanech (pro pravé zálesáky klidně i vlastních), 
  případně ve dvou sdílených pokojích s kapacitou cca 11 a 7 lůžek. Kapacita je omezena, tak nám prosím dejte vědět v dotazníku, jestli máte zájem.
  
  <br> <br> Pokud se vám nic z toho nezdá, doporučujeme ubytování v okolních hotelech a penzionech (Přerov, Olomouc).
