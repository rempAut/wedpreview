title : "Jak tam dojedu?"
content: |
  Ideálně malotraktorem (za kravínem doleva), ale autem se bez potíží dostanete taky. Parkování je přímo u areálu. Pokud vás rozdrtila inflace a nemáte na pohonné hmoty, přijedeme pro vás.

  <br><br>Domů a na hotely vás odveze rozvoz (až ho seženeme, LOL).
